name: Update fantasy points
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/build_fpl.py", ".github/workflows/fpl.yml"]
permissions:
  contents: write
concurrency: fpl
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_fpl.py
      - name: Commit if changed
        run: |
          git config user.name "fpl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && exit 0
          git commit -m "Update fantasy points"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done

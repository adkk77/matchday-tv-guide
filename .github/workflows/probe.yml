name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=20261105-20261106&limit=200" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=20261105-20261106" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=20261105" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=20261105&limit=200" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/scoreboard?dates=20261105" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/summary?event=0" \
            "https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=2026-11-05&s=Soccer" \
            "https://www.thesportsdb.com/api/v1/json/abc123/eventsday.php?d=2026-11-05&s=Soccer" ; do
            echo "== $u"; curl -s --compressed -o /tmp/o -w "HTTP %{http_code} %{size_download}B\n" "$u"; head -c 300 /tmp/o; echo; done

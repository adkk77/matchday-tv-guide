name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://en.fantasy.spl.com.sa/api/bootstrap-static/ https://fantasy.spl.com.sa/api/bootstrap-static/ https://en.fantasy.spl.com.sa/api/fixtures/ https://fantasy.spl.com.sa/api/event-status/ https://en.fantasy.spl.com.sa/api/event/1/live/; do
            echo "== $u"; curl -s -m 20 -A "Mozilla/5.0" -D - "$u" -o body.txt | head -15; head -c 600 body.txt; echo; done
          curl -s -m 20 https://en.fantasy.spl.com.sa/ | grep -o 'src="[^"]*\.js"' | head -5

name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d=2026-11-05&s=Soccer" \
            "https://www.thesportsdb.com/api/v1/json/123/eventstv.php?d=2026-11-05&s=Soccer" \
            "https://www.thesportsdb.com/api/v1/json/123/eventsday.php?d=2026-11-06&s=Soccer" \
            "https://www.thesportsdb.com/api/v1/json/123/searchplayers.php?p=arda" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard?dates=20261105-20261106&limit=200" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/scoreboard?dates=20261104-20261106&limit=200" ; do
            echo "== $u"; curl -s -o /tmp/o -w "HTTP %{http_code} %{size_download}B %{time_total}s\n" -H "Origin: https://adkk77.github.io" -D /tmp/h "$u"; grep -i 'access-control' /tmp/h; head -c 400 /tmp/o; echo; done

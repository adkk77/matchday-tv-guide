name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          E=$(curl -s "$B/aus.1/scoreboard" | python3 -c "import json,sys;d=json.load(sys.stdin);e=d['events'][0];print(e['id'],e['competitions'][0]['competitors'][0]['team']['id'])")
          echo "event/team: $E"; set -- $E
          curl -s "$B/aus.1/summary?event=$1" | python3 -c "
          import json,sys,re;s=sys.stdin.read();print('summary coach hits:',[m.start() for m in re.finditer('oach',s)][:10]);i=s.find('oach');print(s[max(0,i-300):i+300])"
          curl -s "$B/aus.1/teams/$2/roster" | python3 -c "
          import json,sys;d=json.load(sys.stdin);print('roster keys',list(d.keys()));print('coach',d.get('coach'))"
          curl -s "$B/eng.1/teams/359/roster" | python3 -c "
          import json,sys;d=json.load(sys.stdin);print('ars coach',d.get('coach'))"
          curl -s -D - -o /dev/null -H "Origin: https://adkk77.github.io" "$B/eng.1/teams/359/roster" | grep -i access-control

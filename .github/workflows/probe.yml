name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > w.py <<'PY'
          import json,urllib.request,urllib.parse
          H={"User-Agent":"matchday-probe/1.0"}
          def g(p):
              return json.load(urllib.request.urlopen(urllib.request.Request("https://www.wikidata.org/w/api.php?"+urllib.parse.urlencode(p)+"&format=json&origin=*",headers=H),timeout=20))
          for name in ["Sydney","Central Coast","Al Hilal","Arsenal","Palmeiras","Remo","Al-Nassr Saudi FC"]:
              r=g({"action":"wbsearchentities","search":name,"language":"en","limit":8,"type":"item"})["search"]
              hit=next((x for x in r if any(w in (x.get("description") or "").lower() for w in ("football club","soccer club","association football","football team"))),None)
              if not hit:
                  r=g({"action":"wbsearchentities","search":name+" FC","language":"en","limit":8,"type":"item"})["search"]
                  hit=next((x for x in r if any(w in (x.get("description") or "").lower() for w in ("football club","soccer club","association football","football team"))),None)
              if not hit: print(name,"-> no club",[x.get("description") for x in r][:4]); continue
              e=g({"action":"wbgetentities","ids":hit["id"],"props":"claims"})["entities"][hit["id"]]["claims"].get("P286",[])
              cur=[c for c in e if "P582" not in c.get("qualifiers",{})]
              ids=[c["mainsnak"]["datavalue"]["value"]["id"] for c in (cur or e)[-1:] if "datavalue" in c["mainsnak"]]
              lab=g({"action":"wbgetentities","ids":"|".join(ids),"props":"labels","languages":"en"})["entities"] if ids else {}
              print(name,"->",hit["label"],hit.get("description"),"| coach:",[lab[i]["labels"].get("en",{}).get("value") for i in ids])
          PY
          python3 w.py
          curl -s -D - -o /dev/null -H "Origin: https://adkk77.github.io" "https://www.wikidata.org/w/api.php?action=wbsearchentities&search=x&language=en&format=json&origin=*" | grep -i access-control-allow-origin

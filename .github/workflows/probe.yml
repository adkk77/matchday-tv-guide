name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t=Sydney_FC" | python3 -c "import json,sys;d=json.load(sys.stdin);t=(d.get('teams') or [{}])[0];print({k:v for k,v in t.items() if 'anager' in k or 'oach' in k or k in ('idTeam','strTeam')})"
          curl -s "https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t=Arsenal" | python3 -c "import json,sys;d=json.load(sys.stdin);t=(d.get('teams') or [{}])[0];print({k:v for k,v in t.items() if 'anager' in k or 'oach' in k or k in ('idTeam','strTeam')})"
          curl -s "https://www.thesportsdb.com/api/v1/json/123/lookup_all_players.php?id=133604" | head -c 400; echo
          curl -s "https://site.web.api.espn.com/apis/site/v2/sports/soccer/aus.1/teams/5327" | python3 -c "import json,sys,re;s=sys.stdin.read();i=s.find('oach');print(i, s[max(0,i-200):i+200])"

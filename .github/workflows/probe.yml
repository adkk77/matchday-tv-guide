name: probe-bein
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sSL -m 40 -A "Mozilla/5.0" https://epgshare01.online/epgshare01/ -o idx.html
          echo "FILES:"; grep -o 'epg_ripper_[A-Za-z0-9_]*\.xml\.gz' idx.html | sort -u | tr '\n' ' '; echo
          for f in $(grep -o 'epg_ripper_[A-Za-z0-9_]*\.xml\.gz' idx.html | sort -u | grep -Ei 'BEIN|QA|SA[0-9]|KW|AE[0-9]|ARAB|MENA'); do
            curl -sSL -m 60 "https://epgshare01.online/epgshare01/$f" -o x.gz; gunzip -c x.gz > x.xml 2>/dev/null
            echo "=== $f CHANNELS:"; grep -o 'channel id="[^"]*"' x.xml | sed 's/channel id=//' | grep -Ei 'bein|kass|ktv|kuwait|thmanyah|ssc|sport' | sort -u | tr '\n' ' '; echo
            python3 - <<'PY'
          import re
          s=open('x.xml',encoding='utf-8',errors='ignore').read(); n=0
          for m in re.finditer(r'<programme start="(\d{12})\d\d ([+-]\d{4})"[^>]*channel="([^"]*)"[^>]*>\s*<title[^>]*>([^<]*)',s):
              ch,t=m.group(3),m.group(4)
              if re.search(r'(?i)bein|kass|ktv|ssc|thmanyah|kuwait',ch) and re.search(r'(?i)\bvs?\b\.?|×| v ',t) and m.group(1).startswith('20261105'):
                  print(' ',m.group(1),m.group(2),ch,'|',t[:90]); n+=1
                  if n>=40: break
          PY
          done
          echo "=== bein site"; curl -sSL -m 30 -A "Mozilla/5.0" -o b.html "https://www.beinsports.com/en-mena/tv-guide"
          grep -o 'beIN SPORTS [0-9]*' b.html | sort | uniq -c | head; python3 - <<'PY'
          import re
          s=open('b.html',encoding='utf-8',errors='ignore').read()
          for k in ['epg','schedule','programme','startTime','start_time','channelName']:
              i=s.find(k); print(k, i, s[max(0,i-200):i+300].replace('\n',' ') if i>=0 else '')
          PY

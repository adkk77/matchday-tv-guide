name: probe
on: push
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > w.py <<'PY'
          import json,urllib.request,urllib.parse,time
          H={"User-Agent":"matchday-probe/1.0 (github.com/adkk77)"}
          def g(p):
              time.sleep(1.2)
              return json.load(urllib.request.urlopen(urllib.request.Request("https://www.wikidata.org/w/api.php?"+urllib.parse.urlencode(p)+"&format=json&origin=*",headers=H),timeout=20))
          for name in ["Cruzeiro","Bahia","AC Milan"]:
              r=g({"action":"wbsearchentities","search":name,"language":"en","limit":8,"type":"item"})["search"]
              print(name,[(x["id"],x.get("label"),x.get("description")) for x in r])
              hit=next((x for x in r if any(w in (x.get("description") or "").lower() for w in ("football club","soccer club","association football","football team"))),None)
              if not hit: continue
              cl=g({"action":"wbgetentities","ids":hit["id"],"props":"claims"})["entities"][hit["id"]]["claims"].get("P286",[])
              for c in cl:
                  q=c.get("qualifiers",{})
                  print("  ",c["mainsnak"].get("datavalue",{}).get("value",{}).get("id"),"start",[x["datavalue"]["value"]["time"] for x in q.get("P580",[]) if "datavalue" in x],"end",[x.get("datavalue",{}).get("value",{}).get("time") for x in q.get("P582",[])],"rank",c.get("rank"))
          PY
          python3 w.py
